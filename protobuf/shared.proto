syntax = "proto3";

option go_package = "./../pkg/a2l";

message IntType {
  int32 Value = 1;
  uint32 Base = 2;
  uint32 Size = 3;
}

message LongType {
  int64 Value = 1;
  uint32 Base = 2;
  uint32 Size = 3;
}

// ULongType carries the parameters which ASAM MCD-2 MC 1.6.1 declares as uint64, i.e. BIT_MASK
// and ERROR_MASK (chapter 1.4.4: "The keyword parameters from BIT_MASK and ERROR_MASK are
// extended from ulong to uint64"). LongType cannot hold them, its value is signed.
message ULongType {
  uint64 Value = 1;
  uint32 Base = 2;
  uint32 Size = 3;
}

message FloatType {
  // 2 to 6 described the layout of the value (sign, number of digits, exponent); they are
  // replaced by Source, which holds the value as written
  reserved 2 to 6;
  reserved "IntegralSign", "IntegralSize", "DecimalSize", "ExponentSign", "ExponentSize";
  double Value = 1;
  // the value as written in the parsed file; it is reproduced verbatim when the tree is
  // serialized back to A2L
  string Source = 7;
}

message IdentType {
  string Value = 1;
}

message StringType {
  string Value = 1;
}

message TagType {
  string Value = 1;
}