syntax = "proto3";

import "protobuf/A2L.proto";

option go_package = "./../pkg/a2l";

service A2L {
  rpc GetTreeFromA2L (stream TreeFromA2LRequest) returns (stream TreeResponse) {}
  rpc GetJSONFromTree (stream JSONFromTreeRequest) returns (stream JSONResponse) {}
  rpc GetTreeFromJSON (stream TreeFromJSONRequest) returns (stream TreeResponse) {}
  rpc GetA2LFromTree (stream A2LFromTreeRequest) returns (stream A2LResponse) {}
}

message TreeFromA2LRequest {
  bytes a2l = 1;
  // rejects files containing keywords which require a newer ASAP2 version than the one the file
  // declares with ASAP2_VERSION; without this flag such keywords are reported as warnings
  optional bool enforce_version_check = 2;
}

message A2LResponse {
  bytes a2l = 1;
  optional string error = 2;
}

message JSONFromTreeRequest {
  bytes tree = 1;
  optional uint32 indent = 3;
  optional bool allow_partial = 4;
  optional bool emit_unpopulated = 5;
}

message A2LFromTreeRequest {
  bytes tree = 1;
  optional uint32 indent = 2;
  optional bool sorted = 3;
}

message TreeResponse {
  bytes serializedTreeChunk = 1;
  optional string error = 2;
  // the warnings the parser reported: constructs requiring a newer ASAM MCD-2 MC version than the
  // one the file declares, keywords used more often than the specification allows, and the like.
  // They come in responses of their own, which precede the chunks of the tree, and are spread over
  // as many of them as their number requires for each response to fit the maximum message size;
  // a client collects them from every response of the stream. They are sent whether the file
  // parsed or not, so a response carrying the error may follow them.
  repeated string warnings = 3;
}

message TreeFromJSONRequest {
  bytes json = 1;
  optional bool allow_partial = 2;
}

message JSONResponse {
  bytes json = 1;
  optional string error = 2;
}