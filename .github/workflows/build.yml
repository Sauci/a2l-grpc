name: build

on: [push, pull_request]

jobs:
  generate-antlr-sources:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: ./generate_antlr.sh
      - uses: actions/upload-artifact@v7
        with:
          name: antlr4
          path: |
            pkg/a2l/parser/grammar
  generate-grpc-sources:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: ./generate_grpc.sh
      - uses: actions/upload-artifact@v7
        with:
          name: grpc
          path: |
            pkg/a2l/protobuf
  test-linux:
    runs-on: ubuntu-22.04
    needs:
      - generate-antlr-sources
      - generate-grpc-sources
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: antlr4
          path: pkg/a2l/parser
      - uses: actions/download-artifact@v8
        with:
          name: grpc
          path: pkg/a2l
      - run: |
          go get github.com/antlr4-go/antlr/v4
          go test ./cmd/a2l/... ./pkg/a2l/...
  test-windows:
    runs-on: windows-latest
    needs:
      - generate-antlr-sources
      - generate-grpc-sources
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: antlr4
          path: pkg/a2l/parser
      - uses: actions/download-artifact@v8
        with:
          name: grpc
          path: pkg/a2l
      - run: |
          go get github.com/antlr4-go/antlr/v4
          go test ./cmd/a2l/... ./pkg/a2l/...
  test-mac:
    runs-on: macos-latest-xlarge
    needs:
      - generate-antlr-sources
      - generate-grpc-sources
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: antlr4
          path: pkg/a2l/parser
      - uses: actions/download-artifact@v8
        with:
          name: grpc
          path: pkg/a2l
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - run: |
          go get github.com/antlr4-go/antlr/v4
          go test ./cmd/a2l/... ./pkg/a2l/...
  build-linux:
    runs-on: ubuntu-22.04
    needs:
      - test-linux
    strategy:
      matrix:
        target: [ 386, amd64, arm64, arm ]
        include:
          - target: 386
            CGO_ENABLED: 1
            GOARCH: 386
            CC: gcc
            CGO_FLAGS: -m32
          - target: amd64
            CGO_ENABLED: 1
            GOARCH: amd64
            CC: gcc
            CGO_FLAGS: ""
          - target: arm64
            CGO_ENABLED: 1
            GOARCH: arm64
            CC: /usr/local/aarch64--glibc--stable-2020.08-1/bin/aarch64-buildroot-linux-gnu-gcc
            CGO_FLAGS: ""
            toolchain_source: https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--glibc--stable-2020.08-1.tar.bz2
            toolchain_extract: sudo tar -xf aarch64--glibc--stable-2020.08-1.tar.bz2 -C /usr/local
          - target: arm
            CGO_ENABLED: 1
            GOARCH: arm
            CC: /usr/local/armv5-eabi--glibc--stable-2020.08-1/bin/arm-buildroot-linux-gnueabi-gcc
            CGO_FLAGS: ""
            toolchain_source: https://toolchains.bootlin.com/downloads/releases/toolchains/armv5-eabi/tarballs/armv5-eabi--glibc--stable-2020.08-1.tar.bz2
            toolchain_extract: sudo tar -xf armv5-eabi--glibc--stable-2020.08-1.tar.bz2 -C /usr/local
    env:
      CGO_ENABLED: ${{ matrix.CGO_ENABLED }}
      GOOS: linux
      GOARCH: ${{ matrix.GOARCH }}
      CC: ${{ matrix.CC }}
    name: build-linux-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: antlr4
          path: pkg/a2l/parser
      - uses: actions/download-artifact@v8
        with:
          name: grpc
          path: pkg/a2l
      - if: ${{ matrix.GOARCH == '386' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dev-i386
      - if: ${{ matrix.CC != 'gcc' }}
        run: |
          wget ${{ matrix.toolchain_source }}
          ${{ matrix.toolchain_extract }}
      - run: |
          go get github.com/antlr4-go/antlr/v4
          go build --buildmode=c-shared -o a2l_grpc_$(go env GOOS)_$(go env GOARCH).so ./cmd/a2l/a2l.go
      - uses: actions/upload-artifact@v7
        with:
          name: linux_${{ matrix.target }}
          path: |
            *.so
            *.h
  build-windows:
    runs-on: windows-latest
    needs:
      - test-windows
    strategy:
      matrix:
        mingw: [ "MINGW32", "MINGW64" ]
        include:
          - mingw: "MINGW32"
            path: "C:/msys64/mingw32/bin"
            GOARCH: 386
          - mingw: "MINGW64"
            path: "C:/msys64/usr/bin"
            GOARCH: amd64
    env:
      CGO_ENABLED: 1
      GOARCH: ${{ matrix.GOARCH }}
    name: MSYS2 ${{ matrix.mingw }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: antlr4
          path: pkg/a2l/parser
      - uses: actions/download-artifact@v8
        with:
          name: grpc
          path: pkg/a2l
      - name: Print system version
        shell: powershell
        run: |
          uname
      - if: ${{ matrix.GOARCH == '386' }}
        name: Install 32-bit MinGW toolchain
        shell: powershell
        run: |
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm mingw-w64-i686-gcc
      - shell: powershell
        run: |
          go get github.com/antlr4-go/antlr/v4
          $env:PATH="${{ matrix.path }};$env:PATH" ;go build --buildmode=c-shared -o a2l_grpc_$(go env GOOS)_${{ matrix.GOARCH }}.dll ./cmd/a2l/a2l.go
      - uses: actions/upload-artifact@v7
        with:
          name: windows_${{ matrix.GOARCH }}
          path: |
            *.dll
            *.h
  build-mac-intel:
    runs-on: macos-15-intel
    needs:
      - test-mac
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: antlr4
          path: pkg/a2l/parser
      - uses: actions/download-artifact@v8
        with:
          name: grpc
          path: pkg/a2l
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          go get github.com/antlr4-go/antlr/v4
          go build --buildmode=c-shared -o a2l_grpc_$(go env GOOS)_$(go env GOARCH).dylib ./cmd/a2l/a2l.go
      - uses: actions/upload-artifact@v7
        with:
          name: mac_intel
          path: |
            *.dylib
            *.h
  build-mac-arm64:
    runs-on: macos-latest
    needs:
      - test-mac
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: antlr4
          path: pkg/a2l/parser
      - uses: actions/download-artifact@v8
        with:
          name: grpc
          path: pkg/a2l
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          go get github.com/antlr4-go/antlr/v4
          go build --buildmode=c-shared -o a2l_grpc_$(go env GOOS)_$(go env GOARCH).dylib ./cmd/a2l/a2l.go
      - uses: actions/upload-artifact@v7
        with:
          name: mac_arm64
          path: |
            *.dylib
            *.h
  export-protobuf-definitions:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v7
        with:
          name: protobuf
          path: |
            protobuf
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    needs:
      - build-linux
      - build-windows
      - build-mac-intel
      - build-mac-arm64
      - export-protobuf-definitions
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - run: mkdir a2l_grpc
      - uses: actions/download-artifact@v8
        with:
          name: linux_386
          path: a2l_grpc
      - uses: actions/download-artifact@v8
        with:
          name: linux_amd64
          path: a2l_grpc
      - uses: actions/download-artifact@v8
        with:
          name: linux_arm64
          path: a2l_grpc
      - uses: actions/download-artifact@v8
        with:
          name: linux_arm
          path: a2l_grpc
      - uses: actions/download-artifact@v8
        with:
          name: windows_386
          path: a2l_grpc
      - uses: actions/download-artifact@v8
        with:
          name: windows_amd64
          path: a2l_grpc
      - uses: actions/download-artifact@v8
        with:
          name: mac_arm64
          path: a2l_grpc
      - uses: actions/download-artifact@v8
        with:
          name: mac_intel
          path: a2l_grpc
      - uses: actions/download-artifact@v8
        with:
          name: protobuf
          path: a2l_grpc/protobuf
      - run: |
          tar czf a2l_grpc.tar.gz a2l_grpc
          rm -rf a2l_grpc
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          commit: main
          artifacts: "a2l_grpc.tar.gz"
          bodyFile: "CHANGELOG.md"
